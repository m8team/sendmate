name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Deploy to Cloudflare button needs wrangler.jsonc without a database id. Forks can keep theirs.
      - name: wrangler.jsonc has no database_id
        if: github.repository == 'm8team/sendmate'
        run: "! grep -q '\"database_id\"' wrangler.jsonc"
      - run: npm ci
      - run: npm run typecheck
      # Fails if any coverage metric drops below 70% (thresholds in worker/vitest.config.ts).
      - run: npm run test:coverage
      # @sendm8/react: the published client library.
      - run: npm run typecheck -w @sendm8/react
      - run: npm run test:coverage -w @sendm8/react
      - run: npm run build -w @sendm8/react
      - run: npm run test:dist -w @sendm8/react

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Run inside web/: with --prefix, npm installs the repo root into web/node_modules.
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      # Fails if data-layer coverage drops below 70% (thresholds in web/vitest.config.ts).
      - run: npm run test:coverage
        working-directory: web
      - run: npm run build
        working-directory: web
