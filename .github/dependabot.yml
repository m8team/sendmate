version: 2

# One weekly batch per package tree, grouped so a handful of bumps arrives as one PR.
# Security updates still open their own PRs as soon as an advisory lands.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Types for the Node version we run (22, in .node-version), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native compiler without the JS API that astro check and the Vue tooling use.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  # web/ has its own lockfile and isn't an npm workspace.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Types for the Node version we run (22, in .node-version), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native compiler without the JS API that astro check and the Vue tooling use.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
